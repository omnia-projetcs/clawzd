services:
  clawzd:
    build: .
    container_name: clawzd
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./chroma_db:/app/chroma_db
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clawzd-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # If host port 11434 is already in use by a native Ollama service on the host:
    # Option A: Comment out the ports mapping below so Ollama runs inside Docker network only.
    # Option B: Map it to a different host port, e.g. - "11435:11434".
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - clawzd-net

networks:
  clawzd-net:
    driver: bridge
