services:
  clawzd:
    build: .
    container_name: clawzd
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./chroma_db:/app/chroma_db
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clawzd-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Host port defaults to 11435 to avoid clashing with a native Ollama service on 11434.
    # Override with OLLAMA_HOST_PORT=11434 if you want the container exposed there.
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ./models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - clawzd-net

networks:
  clawzd-net:
    driver: bridge
